    <script>
      // Suppress harmless Vite dev server websocket messages in sandboxed preview iframe
      (function() {
        // 1. Quiet mock for Vite HMR WebSocket in sandboxed iframe where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1));

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                binaryType: 'blob',
                readyState: 1, // WebSocket.OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(event, fn) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(fn);
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockSocket;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Filter any residual Vite console notices or errors
        function isViteNotice(arg) {
          if (!arg) return false;
          if (typeof arg === 'string') {
            return arg.indexOf('[vite]') !== -1 || arg.indexOf('failed to connect to websocket') !== -1;
          }
          if (typeof arg === 'object') {
            try {
              var s = arg.message || arg.stack || String(arg);
              return typeof s === 'string' && (s.indexOf('[vite]') !== -1 || s.indexOf('failed to connect to websocket') !== -1);
            } catch (e) {
              return false;
            }
          }
          return false;
        }

        function hasViteArg(args) {
          for (var i = 0; i < args.length; i++) {
            if (isViteNotice(args[i])) return true;
          }
          return false;
        }

        ['error', 'warn', 'info'].forEach(function(level) {
          var orig = console[level];
          if (orig) {
            console[level] = function() {
              if (hasViteArg(arguments)) return;
              return orig.apply(console, arguments);
            };
          }
        });

        window.addEventListener('error', function(e) {
          if (isViteNotice(e.message) || isViteNotice(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteNotice(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
